<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Propose an action before approval</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet" />
  <style data-diagram-style>
    .intro-diagram[data-family] { max-width: 400px; min-width: 0; margin: 0; font-family: "Inter", "Segoe UI", sans-serif; }
    .intro-diagram[data-family] svg { display: block; width: 100%; height: auto; background: #fff; }
    .intro-diagram[data-family] text { fill: #032254; font-family: "Inter", "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; }
    .intro-diagram[data-family] .family-detail { fill: #47494e; font-size: 16px; font-weight: 400; }
    .intro-diagram[data-family] .family-node { fill: #fff; stroke: #032254; stroke-width: 1.5; }
    .intro-diagram[data-family] .family-focus { fill: #f5f8fe; stroke: #1a77e3; stroke-width: 2; }
    .intro-diagram[data-family] .family-edge { fill: none; stroke: #47494e; stroke-width: 1.5; }
    .intro-diagram[data-family] figcaption { margin-top: 12px; color: #47494e; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <figure class="intro-diagram" data-family="tools">
    <div class="diagram-container">
      <svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="family-tools-title family-tools-desc">
        <title id="family-tools-title">Propose an action before approval</title>
        <desc id="family-tools-desc">A maintenance request leads to an investigation and proposed work order, which a manager reviews before any authorized business operation.</desc>
        <defs><marker id="family-tools-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#47494e" /></marker></defs>
        <path class="family-edge" d="M180 64 V100" marker-end="url(#family-tools-arrow)" />
        <path class="family-edge" d="M180 156 V192" marker-end="url(#family-tools-arrow)" />
        <path class="family-edge" d="M180 248 V284" marker-end="url(#family-tools-arrow)" />
        <g><rect class="family-node" x="24" y="8" width="312" height="56" rx="6" /><text x="44" y="44">Receive a request</text></g>
        <g><rect class="family-node" x="24" y="100" width="312" height="56" rx="6" /><text x="44" y="136">Investigate with allowed tools</text></g>
        <g><rect class="family-node" x="24" y="192" width="312" height="56" rx="6" /><text x="44" y="228">Propose a work order</text></g>
        <g><rect class="family-focus" x="24" y="284" width="312" height="68" rx="6" /><text x="44" y="312">Manager reviews the proposal</text><text class="family-detail" x="44" y="336">Approve or reject</text></g>
      </svg>
    </div>
    <figcaption>A proposal is not permission to act. Execution still needs authorization and protection against duplicate operations.</figcaption>
  </figure>
</body>
</html>
