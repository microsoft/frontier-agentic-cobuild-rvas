<svg class="v v-loop" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="v-loop-title v-loop-desc">
<title id="v-loop-title">Brainstorm, agree, delegate, verify: a loop around shared understanding</title>
<desc id="v-loop-desc">Brainstorm with agents drafts the shared understanding, made of glossary, diagrams, prototype and spec. Agree, where humans sign off on pictures, feeds it as signed off. Delegate: agents implement from the spec, reading it. Verify with tests and review, which updates it. When reality differs from the spec, the loop returns to brainstorm. Verification is increasingly automated; agreement still needs people.</desc>
