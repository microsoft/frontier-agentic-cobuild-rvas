<rect class="v-focus" x="600" y="218" width="196" height="64" rx="6" /><text x="698" y="246" class="v-title v-blue-text" text-anchor="middle">Agree</text><text x="698" y="267" class="v-sub" text-anchor="middle">humans sign off on pictures</text>
