<svg class="v v-container-view" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 508" role="img" aria-labelledby="v-container-view-title v-container-view-desc">
<title id="v-container-view-title">Container view of the change request review system</title>
<desc id="v-container-view-desc">Outside the system boundary, three people: a contractor from an external firm submits; a site inspector from department staff adds evidence; a contract manager approves or rejects and decides. Inside the boundary, the web app for submit and review calls the change request API for rules and routing. The API records cases and an audit trail in the case store, checks budget in the external contract and ERP system holding clauses, budget and commitments, and asks the AI pre-assessment, which reads the external document store of drawings and site photos. The AI pre-assessment is the focal step and is annotated: the AI suggests; a named person approves.</desc>
