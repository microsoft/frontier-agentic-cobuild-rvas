<svg class="v v-request-two-systems" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 540" role="img" aria-labelledby="v-request-two-systems-title v-request-two-systems-desc">
<title id="v-request-two-systems-title">What was intended compared with what the agent built</title>
<desc id="v-request-two-systems-desc">Left, what was intended: a contractor, who builds for the department, submits through change request intake for variation orders; an AI pre-assessment reads contract, budget and procurement rules from the contract and budget system of record; the contract manager decides with site inspector evidence, updates the budget and keeps an audit log. Right, what the agent built: a citizen uses a public request portal, an open web form; an AI chatbot answers questions and routes complaints using a public map of roadworks; a works progress dashboard shows public status updates with no decision and no approver. Middle, five differences: a contractor became a citizen; a contract change request became a public enquiry form; checks against the contract became a chatbot; contract and budget records became a public map; nobody approves or rejects the request.</desc>
<defs>
<marker id="v-request-two-systems-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="v-head" /></marker>
<marker id="v-request-two-systems-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="v-head-blue" /></marker>
</defs>
