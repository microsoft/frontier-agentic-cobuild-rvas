or="middle">External</text><text x="1030" y="319" class="v-title">Map of roadworks</text><text x="1030" y="337" class="v-sub">public map layer</text><path d="M1016 309H988" class="v-line" marker-end="url(#v-request-two-systems-arrow)" /><text x="1001" y="301" class="v-cap v-cap-xs" text-anchor="middle">Reads</text><line x1="0" y1="506" x2="1152" y2="506" class="v-rule" /><text x="0" y="532" class="v-cap">Legend</text><rect x="90" y="520" width="22" height="16" rx="3" class="v-focus" /><text x="120" y="532.5" class="v-legend">The decision step</text><rect x="270" y="520" width="22" height="16" rx="3" class="v-person" /><text x="300" y="532.5" class="v-legend">Person</text><rect x="380" y="520" width="22" height="16" rx="3" class="v-box" /><text x="410" y="532.5" class="v-legend">Step</text><rect x="480" y="520" width="22" height="16" rx="3" class="v-ext" /><text x="510" y="532.5" class="v-legend">External data</text>
