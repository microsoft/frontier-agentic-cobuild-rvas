<svg class="v v-prototype-cr-0147" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-labelledby="v-prototype-cr-0147-title v-prototype-cr-0147-desc">
<title id="v-prototype-cr-0147-title">Throwaway prototype of the contract manager review screen for change request CR-0147</title>
<desc id="v-prototype-cr-0147-desc">Sketchy low-fidelity wireframe of contracts.example/change-requests/CR-0147: Change request CR-0147, Bridge deck resurfacing, Lot 3, status Awaiting site inspection. Request: contractor Lot 3 contractor, amount 48,200 euros, reason unforeseen rebar corrosion under deck, evidence three photos. AI pre-assessment, a suggestion, not a decision: clause 12.3 covers unforeseen structural conditions (check); lot budget remaining 112,000 euros (check); warning: cumulative changes 17 percent of contract value, re-tender review at 20 percent; missing: inspector site report. Each line links to the clause, ledger entry or document it was checked against. Buttons: Request more info, Send to site inspection, and Approve, which is disabled and enabled after inspection. Markers 1 to 3 point to the Approve button, the cumulative-changes warning and the AI panel heading.</desc>
