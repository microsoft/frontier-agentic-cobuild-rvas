<svg class="v v-swimlane" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 496" role="img" aria-labelledby="v-swimlane-title v-swimlane-desc">
<title id="v-swimlane-title">Swimlane: one change request from submission to decision</title>
<desc id="v-swimlane-desc">Four lanes. The contractor submits a change request with drawings, photos and cost. The AI pre-assessment checks the rules, meaning clauses, budget and limits, then drafts an assessment that cites clauses and flags gaps. The site inspector verifies on site and writes a site report. The contract manager decides whether the request is within delegated authority. If yes, they approve and the budget is updated. If it is over the threshold, it escalates to the board, above the sign-off limit. If there is an evidence gap, the contractor provides more evidence to fill the flagged gaps and resubmits for a re-check.</desc>
<defs>
<marker id="v-swimlane-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="v-head" /></marker>
<marker id="v-swimlane-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="v-head-blue" /></marker>
</defs>
