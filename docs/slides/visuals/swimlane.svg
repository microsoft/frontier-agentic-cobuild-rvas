 x="350" y="167" class="v-sub" text-anchor="middle">clauses · budget · limits</text><rect class="v-box" x="480" y="121" width="210" height="58" rx="6" /><text x="585" y="146" class="v-title" text-anchor="middle">Drafts assessment</text><text x="585" y="167" class="v-sub" text-anchor="middle">cites clauses, flags gaps</text><rect class="v-box" x="630" y="221" width="160" height="58" rx="6" /><text x="710" y="246" class="v-title" text-anchor="middle">Verifies on site</text><text x="710" y="267" class="v-sub" text-anchor="middle">site report</text><rect class="v-box" x="760" y="21" width="220" height="58" rx="6" /><text x="870" y="46" class="v-title" text-anchor="middle">Provides more evidence</text><text x="870" y="67" class="v-sub" text-anchor="middle">fills the flagged gaps</text><path d="M770 360L870 310L970 360L870 410Z" class="v-box" /><text x="870" y="356" class="v-title" text-anchor="middle">Within delegated</text><text x="870" y="376" class="v-title" text-anchor="middle">authority?</text><rect class="v-focus" x="1000" y="331" width="152" height="58" rx="6" /><text x="1076" y="356" class="v-title" text-anchor="middle">Approves</text><text x="1076" y="377" class="v-sub" text-anchor="middle">budget updated</text><rect class="v-box" x="1000" y="398" width="152" height="50" rx="6" /><text x="1076" y="419" class="v-title" text-anchor="middle">Escalates to board</text><text x="1076" y="440" class="v-sub" text-anchor="middle">above sign-off limit</text><line x1="0" y1="464" x2="1152" y2="464" class="v-rule" /><text x="0" y="490" class="v-cap">Legend</text><rect x="90" y="478" width="22" height="16" rx="3" class="v-box" /><text x="120" y="490.5" class="v-legend">Step</text><path d="M180 486l11 -8 11 8 -11 8z" class="v-box" /><text x="210" y="490.5" class="v-legend">Human decision</text><rect x="340" y="478" width="22" height="16" rx="3" class="v-focus" /><text x="370" y="490.5" class="v-legend">Desired outcome</text><path d="M510 486h26" class="v-line" marker-end="url(#v-swimlane-arrow)" /><text x="546" y="490.5" class="v-legend">Handoff</text><path d="M640 486h26" class="v-line v-dash" marker-end="url(#v-swimlane-arrow)" /><text x="676" y="490.5" class="v-legend">Loop back for re-check</text>
</svg>
