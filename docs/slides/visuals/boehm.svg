<svg class="v v-boehm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 480" role="img" aria-labelledby="v-boehm-title v-boehm-desc">
<title id="v-boehm-title">Time to fix a misunderstanding, by the stage where it is found</title>
<desc id="v-boehm-desc">Illustrative bar chart. Found in Q and A: minutes, change one answer. Diagram review: minutes, change one label; the second attempt caught it here. Prototype review: hours, change one screen. Built code: days, redo code, data model and plan; the first attempt caught it here and the build was discarded. In production: weeks, redo code and data and rebuild trust.</desc>
<defs>
<marker id="v-boehm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="v-head" /></marker>
<marker id="v-boehm-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="v-head-blue" /></marker>
</defs>
<path d="M64 60V400H1152" class="v-axis" /><text x="22" y="230" class="v-cap" text-anchor="middle" transform="rotate(-90 22 230)">Time to fix</text><rect x="109" y="392" width="128" height="8" class="v-bar" /><text x="173" y="354" class="v-cap" text-anchor="middle">Minutes</text><text x="173" y="378" class="v-body" text-anchor="middle">change one answer</text><text x="173" y="430" class="v-stage" text-anchor="middle">Q&amp;A</text><rect x="326" y="382" width="128" height="18" class="v-focus" /><text x="390" y="344" class="v-cap" text-anchor="middle">Minutes</text><text x="390" y="368" class="v-body" text-anchor="middle">change one label</text><text x="390" y="292" class="v-call" text-anchor="middle">Second attempt:</text><text x="390" y="313" class="v-call" text-anchor="middle">caught here</text><text x="390" y="430" class="v-stage v-blue-text" text-anchor="middle">Diagram review</text><rect x="543" y="342" width="128" height="58" class="v-bar" /><text x="607" y="304" class="v-cap" text-anchor="middle">Hours</text><text x="607" y="328" class="v-body" text-anchor="middle">change one screen</text><text x="607" y="430" class="v-stage" text-anchor="middle">Prototype review</text><rect x="760" y="240" width="128" height="160" class="v-focus" /><text x="824" y="202" class="v-cap" text-anchor="middle">Days</text><text x="824" y="226" class="v-body" text-anchor="middle">redo code, data model, plan</text><text x="824" y="150" class="v-call" text-anchor="middle">First attempt: caught here.</text><text x="824" y="171" class="v-call" text-anchor="middle">Build discarded.</text><text x="824" y="430" class="v-stage v-blue-text" text-anchor="middle">Built code</text><rect x="977" y="100" width="128" height="300" class="v-bar" /><text x="1041" y="42" class="v-cap" text-anchor="middle">Weeks</text><text x="1041" y="66" class="v-body" text-anchor="middle">redo code and data,</text><text x="1041" y="86" class="v-body" text-anchor="middle">rebuild trust</text><text x="1041" y="430" class="v-stage" text-anchor="middle">In production</text><line x1="0" y1="446" x2="1152" y2="446" class="v-rule" /><text x="0" y="472" class="v-cap">Legend</text><rect x="70" y="460" width="22" height="16" rx="3" class="v-focus" /><text x="100" y="472.5" class="v-legend">Where the case caught it</text><rect x="290" y="460" width="22" height="16" rx="3" class="v-bar" /><text x="320" y="472.5" class="v-legend">Other stages</text><text x="1152" y="472.5" class="v-note" text-anchor="end">Illustrative figures</text>
</svg>
