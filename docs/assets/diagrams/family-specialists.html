<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coordinate specialists with separate permissions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet" />
  <style data-diagram-style>
    .intro-diagram[data-family] { max-width: 400px; min-width: 0; margin: 0; font-family: "Inter", "Segoe UI", sans-serif; }
    .intro-diagram[data-family] svg { display: block; width: 100%; height: auto; background: #fff; }
    .intro-diagram[data-family] text { fill: #032254; font-family: "Inter", "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; }
    .intro-diagram[data-family] .family-detail { fill: #47494e; font-size: 16px; font-weight: 400; }
    .intro-diagram[data-family] .family-node { fill: #fff; stroke: #032254; stroke-width: 1.5; }
    .intro-diagram[data-family] .family-focus { fill: #f5f8fe; stroke: #1a77e3; stroke-width: 2; }
    .intro-diagram[data-family] .family-edge { fill: none; stroke: #47494e; stroke-width: 1.5; }
    .intro-diagram[data-family] figcaption { margin-top: 12px; color: #47494e; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <figure class="intro-diagram" data-family="specialists">
    <div class="diagram-container">
      <svg viewBox="0 0 360 328" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="family-specialists-title family-specialists-desc">
        <title id="family-specialists-title">Coordinate specialists with separate permissions</title>
        <desc id="family-specialists-desc">A coordinator delegates to specialists with distinct permissions, reconciles their results, and hands off an action proposal that still requires approval.</desc>
        <defs><marker id="family-specialists-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#47494e" /></marker></defs>
        <path class="family-edge" d="M144 64 V84 Q144 92 136 92 H88 Q80 92 80 100 V128" marker-end="url(#family-specialists-arrow)" />
        <path class="family-edge" d="M216 64 V84 Q216 92 224 92 H272 Q280 92 280 100 V128" marker-end="url(#family-specialists-arrow)" />
        <path class="family-edge" d="M80 208 V228 Q80 236 88 236 H136 Q144 236 144 244 V264" marker-end="url(#family-specialists-arrow)" />
        <path class="family-edge" d="M280 208 V228 Q280 236 272 236 H224 Q216 236 216 244 V264" marker-end="url(#family-specialists-arrow)" />
        <g><rect class="family-focus" x="24" y="8" width="312" height="56" rx="6" /><text x="44" y="44">Coordinate the task</text></g>
        <g><rect class="family-node" x="8" y="128" width="152" height="80" rx="6" /><text x="24" y="160">Investigator</text><text class="family-detail" x="24" y="188">Read evidence</text></g>
        <g><rect class="family-node" x="200" y="128" width="152" height="80" rx="6" /><text x="216" y="160">Action agent</text><text class="family-detail" x="216" y="188">Propose work</text></g>
        <g><rect class="family-node" x="24" y="264" width="312" height="56" rx="6" /><text x="44" y="300">Reconcile results and hand off</text></g>
      </svg>
    </div>
    <figcaption>This is one coordination pattern. Each specialist has its own tools and permissions; consequential actions need approval.</figcaption>
  </figure>
</body>
</html>
