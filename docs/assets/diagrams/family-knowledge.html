<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Answer with authorized evidence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet" />
  <style data-diagram-style>
    .intro-diagram[data-family] { max-width: 400px; min-width: 0; margin: 0; font-family: "Inter", "Segoe UI", sans-serif; }
    .intro-diagram[data-family] svg { display: block; width: 100%; height: auto; background: #fff; }
    .intro-diagram[data-family] text { fill: #032254; font-family: "Inter", "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; }
    .intro-diagram[data-family] .family-detail { fill: #47494e; font-size: 16px; font-weight: 400; }
    .intro-diagram[data-family] .family-node { fill: #fff; stroke: #032254; stroke-width: 1.5; }
    .intro-diagram[data-family] .family-focus { fill: #f5f8fe; stroke: #1a77e3; stroke-width: 2; }
    .intro-diagram[data-family] .family-edge { fill: none; stroke: #47494e; stroke-width: 1.5; }
    .intro-diagram[data-family] figcaption { margin-top: 12px; color: #47494e; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <figure class="intro-diagram" data-family="knowledge">
    <div class="diagram-container">
      <svg viewBox="0 0 360 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="family-knowledge-title family-knowledge-desc">
        <title id="family-knowledge-title">Answer with authorized evidence</title>
        <desc id="family-knowledge-desc">A question leads to retrieval constrained by the user's permissions, then an answer with citations or an explicit evidence gap.</desc>
        <defs><marker id="family-knowledge-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#47494e" /></marker></defs>
        <path class="family-edge" d="M180 72 V112" marker-end="url(#family-knowledge-arrow)" />
        <path class="family-edge" d="M180 192 V232" marker-end="url(#family-knowledge-arrow)" />
        <g><rect class="family-node" x="24" y="8" width="312" height="64" rx="6" /><text x="44" y="48">Ask a question</text></g>
        <g><rect class="family-focus" x="24" y="112" width="312" height="80" rx="6" /><text x="44" y="144">Retrieve permitted evidence</text><text class="family-detail" x="44" y="172">Apply the user's permissions</text></g>
        <g><rect class="family-node" x="24" y="232" width="312" height="64" rx="6" /><text x="44" y="272">Answer with citations</text></g>
      </svg>
    </div>
    <figcaption>If evidence is missing or conflicting, say so. Retrieval alone does not require an agent loop.</figcaption>
  </figure>
</body>
</html>
