<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design ends at approval</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Outfit:wght@500;700&amp;display=swap" rel="stylesheet" />
  <style data-diagram-style>
    .intro-diagram { margin: 32px 0; max-width: 100%; min-width: 0; color: #47494e; font-family: "Inter", "Segoe UI", sans-serif; }
    .intro-diagram .diagram-container { width: 100%; overflow-x: auto; scrollbar-color: #032254 #f5f8fe; }
    .intro-diagram .diagram-container:focus-visible { outline: 3px solid #1a77e3; outline-offset: 4px; }
    .intro-diagram svg { display: block; width: 100%; background: #fff; }
    .intro-diagram text { font-family: "Inter", "Segoe UI", sans-serif; fill: #032254; }
    .intro-diagram .diagram-heading { font-family: "Outfit", "Segoe UI", sans-serif; font-size: 28px; font-weight: 700; }
    .intro-diagram .node-name { font-size: 18px; font-weight: 600; }
    .intro-diagram .detail { font-size: 16px; font-weight: 400; fill: #47494e; }
    .intro-diagram .lane-name { font-size: 16px; font-weight: 600; }
    .intro-diagram .node { fill: #fff; stroke: #032254; stroke-width: 1.5; }
    .intro-diagram .gate { fill: #f5f8fe; stroke: #1a77e3; stroke-width: 2; }
    .intro-diagram .connector { fill: none; stroke: #47494e; stroke-width: 2; }
    .intro-diagram .rule { stroke: #dde6f7; stroke-width: 1; }
    .intro-diagram .boundary { fill: none; stroke: #47494e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .intro-diagram figcaption { margin-top: 16px; font-size: 14px; line-height: 1.7; }
    .intro-diagram .scroll-hint { display: block; margin-top: 4px; font-size: 13px; color: #47494e; }
    @media print {
      .intro-diagram .diagram-container { overflow-x: visible; }
      .intro-diagram svg { min-width: 0 !important; }
      .intro-diagram .scroll-hint { display: none; }
    }
  </style>
</head>
<body>
  <figure class="intro-diagram">
    <div class="diagram-container" role="region" aria-label="Approval handoff diagram; scroll horizontally" tabindex="0">
      <!-- impeccable-disable-next-line cramped-padding: SVG coordinates provide frame insets and node padding. -->
      <svg viewBox="0 0 1280 720" style="min-width: 1280px" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="approval-handoff-title approval-handoff-desc">
        <title id="approval-handoff-title">Design ends at approval</title>
        <desc id="approval-handoff-desc">The creator proposes an architecture, you confirm discovery, the creator prepares and reviews the package, you approve it and explicitly start a separate implementation session.</desc>
        <defs>
          <marker id="approval-handoff-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#47494e" /></marker>
          <marker id="approval-handoff-arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#1a77e3" /></marker>
          <marker id="approval-handoff-arrow-link" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#0078d4" /></marker>
        </defs>
        <rect width="1280" height="720" fill="#fff" />
        <text x="32" y="48" class="diagram-heading">Design ends at approval. Building starts separately.</text>
        <rect x="24" y="88" width="1232" height="160" fill="#f5f8fe" />
        <rect x="24" y="412" width="1232" height="160" fill="#f5f8fe" />
        <path d="M24 248 H1256 M24 412 H1256" class="rule" />
        <path d="M1016 88 V592" class="boundary" />
        <text x="32" y="160" class="lane-name">Creator</text>
        <text x="32" y="332" class="lane-name">You</text>
        <text x="32" y="492" class="lane-name"><tspan x="32">Implementation</tspan><tspan x="32" dy="24">session</tspan></text>
        <path d="M320 168 H409.333 Q417.333 168 417.333 176 V284" class="connector" marker-end="url(#approval-handoff-arrow)" />
        <path d="M470.667 284 V176 Q470.667 168 478.667 168 H568" class="connector" marker-end="url(#approval-handoff-arrow)" />
        <path d="M768 168 H884 Q892 168 892 176 V284" class="connector" marker-end="url(#approval-handoff-arrow)" />
        <path d="M972 332 H1052" class="connector" marker-end="url(#approval-handoff-arrow)" />
        <path d="M1144 380 V448" class="connector" marker-end="url(#approval-handoff-arrow)" />
        <g>
          <rect x="160" y="120" width="160" height="96" rx="6" class="node" />
          <text x="176" y="148" class="node-name">Discovery</text>
          <text x="176" y="176" class="detail"><tspan x="176">Inspect + ask</tspan><tspan x="176" dy="24">Propose design</tspan></text>
        </g>
        <g>
          <rect x="364" y="284" width="160" height="96" rx="6" class="gate" />
          <text x="380" y="316" class="node-name"><tspan x="380">Confirm</tspan><tspan x="380" dy="24">discovery</tspan></text>
          <text x="380" y="364" class="detail">Agree the target</text>
        </g>
        <g>
          <rect x="568" y="120" width="200" height="120" rx="6" class="node" />
          <text x="584" y="148" class="node-name">Prepare package</text>
          <text x="584" y="176" class="detail"><tspan x="584">Write four artifacts</tspan><tspan x="584" dy="24">Review diagrams</tspan><tspan x="584" dy="24">+ complete package</tspan></text>
        </g>
        <g>
          <rect x="812" y="284" width="160" height="96" rx="6" class="gate" />
          <text x="828" y="316" class="node-name"><tspan x="828">Approve</tspan><tspan x="828" dy="24">the package</tspan></text>
          <text x="828" y="364" class="detail">Creator stops</text>
        </g>
        <g>
          <rect x="1052" y="284" width="180" height="96" rx="6" class="node" />
          <text x="1068" y="316" class="node-name"><tspan x="1068">Start a new</tspan><tspan x="1068" dy="24">session</tspan></text>
          <text x="1068" y="364" class="detail">Approved files</text>
        </g>
        <g>
          <rect x="1052" y="448" width="180" height="96" rx="6" class="node" />
          <text x="1068" y="480" class="node-name">Build + validate</text>
          <text x="1068" y="508" class="detail"><tspan x="1068">Acceptance criteria</tspan><tspan x="1068" dy="24">and review findings</tspan></text>
        </g>
        <path d="M32 640 H1248" class="rule" />
        <rect x="32" y="660" width="20" height="20" rx="2" class="gate" />
        <text x="64" y="676" class="detail">Your approval gate</text>
        <path d="M304 660 V684" class="boundary" />
        <text x="320" y="676" class="detail">Separately initiated session, not an automatic continuation</text>
      </svg>
    </div>
    <figcaption>Confirm discovery before package preparation. Approve the complete package after diagram and independent review, or an explicitly accepted manual-review exception. Approval ends the creator workflow; you initiate implementation separately.<span class="scroll-hint">Scroll horizontally if the full diagram is not visible.</span></figcaption>
  </figure>
</body>
</html>
