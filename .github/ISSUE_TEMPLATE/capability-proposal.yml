name: Capability proposal
description: Propose a new plugin skill, workflow step, pattern card, or supporting dependency.
title: "[Proposal] "
labels: ["enhancement"]
body:
  - type: input
    id: outcome
    attributes:
      label: Customer outcome
      description: What becomes faster, safer, cheaper, or more reliable?
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Customer decisions
      description: Which decisions does the change help a customer make?
    validations:
      required: true
  - type: textarea
    id: placement
    attributes:
      label: Placement
      description: Name the skill, reference, or inventory entry that should change, or explain why it needs a new one.
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Approval gates
      description: State how the change keeps discovery confirmation, architecture approval, diagram review, and the separate implementation handoff.
    validations:
      required: true
  - type: dropdown
    id: maturity
    attributes:
      label: Maturity
      options: [proposal, initial, validated]
    validations:
      required: true
