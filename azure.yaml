# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# azd project for the AI Starter Kit session (Microsoft Foundry).
# Golden path:  azd up   ->  provisions infra/ (Bicep)  ->  writes outputs into the azd env,
# which scripts/*  read back as a .env contract (see .env.sample).
#
# This file intentionally has NO `services:` block. The session does not deploy app code
# through azd at provision time — `azd up` only stands up the shared Foundry footprint
# (Foundry resource + project + model deployment + AI Search + App Insights + ACR).
# Follow the selected scenario's lessons to add application code and data.
name: ai-starter-kit-rvas
metadata:
  template: ai-starter-kit-rvas-foundry@2.0.0

# Return to the selected scenario after provisioning.
hooks:
  postprovision:
    posix:
      shell: sh
      continueOnError: true
      run: |
        echo ""
        echo "✅ Infrastructure provisioned. Outputs are in the azd environment."
        echo "   Export them to a .env with:   azd env get-values > .env"
        echo ""
        echo "   Next: follow your scenario's accelerator guide under scenarios/."
        echo ""
